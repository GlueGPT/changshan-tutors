<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>常山师生桥 - 免费补课信息交流平台</title>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js" 
        defer 
        onerror="handleSdkLoadError()"></script>
    <script>
        window.sdkLoadFailed = false;
        function handleSdkLoadError() {
            window.sdkLoadFailed = true;
            var s = document.createElement('script');
            s.src = 'https://unpkg.com/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js';
            s.defer = true;
            s.onerror = function() {
                document.querySelector('.loading-text').textContent = '❌ 核心组件加载失败';
                document.getElementById('loadingSub').innerHTML = 'CDN连接失败，请检查网络后刷新页面<br><button class="retry-btn" onclick="location.reload()">🔄 刷新重试</button>';
            };
            document.head.appendChild(s);
        }
    </script>

    <style>
        :root {
            --primary: #1a5276;
            --primary-light: #2980b9;
            --accent: #e67e22;
            --bg: #f5f6f8;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --text-light: #5a6c7d;
            --border: #e0e4e8;
            --shadow: 0 2px 12px rgba(0,0,0,0.06);
            --radius: 12px;
            --tag-blue: #e8f4fd;
            --tag-blue-text: #1a6daa;
            --tag-green: #e8f8ef;
            --tag-green-text: #1a7a4c;
            --tag-orange: #fef5ec;
            --tag-orange-text: #b86e1c;
            --danger: #c0392b;
            --admin-color: #8e44ad;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        .header {
            background: linear-gradient(135deg, #1a3c5e 0%, #1a5276 40%, #1a6d8a 100%);
            position: sticky; top:0; z-index:100;
            box-shadow: 0 2px 20px rgba(0,0,0,0.15);
        }
        .header-inner {
            max-width: 1200px; margin:0 auto; padding:14px 20px;
            display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
        }
        .logo {
            display:flex; align-items:center; gap:10px; text-decoration:none;
            color:#fff; font-weight:700; font-size:1.35rem;
        }
        .logo-icon {
            width:40px; height:40px; background:rgba(255,255,255,0.18);
            border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1.4rem;
        }
        .btn {
            display:inline-flex; align-items:center; gap:6px;
            padding:10px 18px; border-radius:25px; border:none;
            font-size:0.9rem; cursor:pointer; font-weight:600;
            transition:0.25s; white-space:nowrap; font-family:inherit;
        }
        .btn-primary {
            background:var(--accent); color:#fff;
            box-shadow:0 3px 12px rgba(230,126,34,0.35);
        }
        .btn-outline {
            background:rgba(255,255,255,0.12); color:#fff;
            border:1.5px solid rgba(255,255,255,0.35);
        }
        .btn-sm { padding:6px 14px; font-size:0.8rem; }
        .btn-reset {
            padding:12px 18px; border-radius:25px; background:#fff;
            color:var(--text-light); border:2px solid var(--border);
            cursor:pointer; font-size:0.85rem;
        }
        .main-container { max-width:1200px; margin:0 auto; padding:24px 20px 60px; }
        .hero-section {
            background:linear-gradient(135deg, #eef5fa 0%, #f8fafc 30%, #fdf6f0 100%);

        .hero-subtitle { font-size:0.9rem; color:var(--text-light); margin-bottom:20px; }
        .hero-badge {
            display:inline-block; background:#eafaf1; color:#1a7a4c;
            font-size:0.78rem; padding:4px 12px; border-radius:20px; font-weight:600; margin-bottom:16px;

        .search-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
        .search-input-wrap { flex:1; min-width:200px; position:relative; }
        .search-input-wrap input {
            width:100%; padding:12px 16px 12px 42px; border-radius:25px;
            border:2px solid var(--border); font-size:0.95rem; background:#fff; font-family:inherit;

        .search-input-wrap .search-icon {
            position:absolute; left:14px; top:50%; transform:translateY(-50%);

        }
        .filter-select {
            padding:12px 32px 12px 14px; border-radius:25px;
            border:2px solid var(--border); font-size:0.9rem; background:#fff;
            cursor:pointer; font-family:inherit; min-width:130px;
            appearance:none; -webkit-appearance:none;

            background-repeat:no-repeat; background-position:right 12px center;
        }
        .stats-bar {
            display:flex; align-items:center; justify-content:space-between;
            flex-wrap:wrap; gap:10px; margin-bottom:18px; font-size:0.85rem; color:var(--text-light);
        }
        .cards-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:18px; }
        .teacher-card {
            background:var(--card-bg); border-radius:var(--radius); padding:22px;
            box-shadow:var(--shadow); border:1px solid #eef1f5; cursor:pointer;
            position:relative; display:flex; flex-direction:column; gap:12px;
        }
        .teacher-card:hover { box-shadow:0 8px 30px rgba(0,0,0,0.1); transform:translateY(-2px); }
        .card-top { display:flex; gap:14px; align-items:flex-start; }
        .avatar {
            width:52px; height:52px; border-radius:50%;
            background:linear-gradient(135deg,#e8f0f8,#dce8f4);
            display:flex; align-items:center; justify-content:center;
            font-weight:700; font-size:1.3rem; color:var(--primary); flex-shrink:0;
        }
        .card-tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
        .tag { display:inline-block; padding:3px 10px; border-radius:15px; font-size:0.73rem; font-weight:600; }
        .tag-subject { background:var(--tag-blue); color:var(--tag-blue-text); }
        .tag-grade { background:var(--tag-green); color:var(--tag-green-text); }
        .tag-area { background:var(--tag-orange); color:var(--tag-orange-text); }
        .card-desc {
            font-size:0.85rem; color:var(--text-light);

        }
        .card-footer {
            display:flex; align-items:center; justify-content:space-between;
            flex-wrap:wrap; gap:8px; font-size:0.75rem; color:#999;
            border-top:1px solid #f0f2f5; padding-top:10px; margin-top:auto;
        }
        .card-collect {
            background:none; border:none; font-size:1.2rem; cursor:pointer; padding:4px;
        }
        .card-collect.collected { color:var(--accent); }
        .empty-state { text-align:center; padding:60px 20px; grid-column:1/-1; }
        .empty-icon { font-size:3rem; margin-bottom:12px; }
        .modal-overlay {
            position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:200;
            display:flex; align-items:center; justify-content:center; padding:20px;
        }
        .modal {
            background:#fff; border-radius:var(--radius); max-width:560px;
            width:100%; max-height:85vh; overflow-y:auto;
        }
        .modal-header {
            padding:18px 22px; border-bottom:1px solid #eee;
            display:flex; align-items:center; justify-content:space-between;
            position:sticky; top:0; background:#fff; z-index:10;
        }
        .modal-close {
            background:none; border:none; font-size:1.2rem; cursor:pointer; color:#999;
        }
        .modal-body { padding:22px; }
        .form-panel {
            background:#fff; border-radius:var(--radius); padding:28px;
            box-shadow:var(--shadow); margin-bottom:28px; border:1px solid #eef1f5; display:none;
        }
        .form-panel.visible { display:block; }
        .form-row { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
        .form-group { flex:1; min-width:180px; display:flex; flex-direction:column; gap:4px; }
        .form-group label { font-weight:600; font-size:0.82rem; color:#555; }
        .form-group input,.form-group select,.form-group textarea {
            padding:10px 14px; border-radius:8px; border:1.5px solid var(--border);
            font-size:0.9rem; background:#fafbfc; font-family:inherit;
        }
        .form-group textarea { min-height:80px; resize:vertical; }
        .toast-container { position:fixed; top:20px; right:20px; z-index:999; }
        .toast {
            padding:12px 20px; border-radius:25px; font-size:0.85rem; font-weight:600;
            color:#fff; margin-bottom:8px; box-shadow:0 6px 20px rgba(0,0,0,0.2);
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast.success { background:#27ae60; }
        .toast.error { background:#c0392b; }
        .toast.info { background:#3498db; }
        .toast.warning { background:#f39c12; }
        .btn-admin-delete {
            background:#e74c3c; color:#fff; font-size:0.7rem; padding:4px 10px;
            border-radius:12px; border:none; cursor:pointer; position:absolute; top:8px; right:8px;
        }
        .admin-indicator {
            position:fixed; bottom:20px; left:20px; background:#8e44ad; color:#fff;
            padding:8px 16px; border-radius:20px; font-size:0.78rem; z-index:300; cursor:pointer;
        }
        .footer { text-align:center; padding:24px; font-size:0.75rem; color:#bbb; }
        .btn-danger-text {
            background:none; border:none; color:var(--danger); cursor:pointer;
            font-size:0.85rem; text-decoration:underline;
        }
        .loading-overlay {
            position:fixed; inset:0; background:rgba(255,255,255,0.9); z-index:500;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
        }
        .loading-spinner {
            width:40px; height:40px; border:3px solid #e0e4e8;
            border-top-color:var(--primary); border-radius:50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { margin-top:16px; color:var(--text-light); font-size:0.9rem; }
        .loading-sub { margin-top:8px; color:#aaa; font-size:0.75rem; }
        .retry-btn {
            margin-top:16px; padding:8px 20px; border-radius:20px;
            background:var(--primary); color:#fff; border:none; cursor:pointer;
        }
        .offline-badge {
            display:inline-block; background:#fff3cd; color:#856404;
            font-size:0.7rem; padding:2px 8px; border-radius:10px; margin-left:8px;
        }
        @media (max-width:768px) {
            .cards-grid { grid-template-columns:1fr; }
            .search-row { flex-direction:column; }
        }
    </style>
</head>
<body>

        // 如果未加载 SDK
        if (typeof supabase === 'undefined') {
            document.querySelector('.loading-text').textContent = '❌ 核心组件加载失败';
            document.getElementById('loadingSub').innerHTML = 'CDN连接失败，请检查网络后刷新页面<br><button class="retry-btn" onclick="location.reload()">🔄 刷新重试</button>';
        } else {
            try {
                sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            } catch (e) {
                console.error(e);
                showLoadingError('数据库初始化失败');
            }
        }

        // ---------- 缓存 ----------
        function getCachedTeachers() {
            try { return JSON.parse(localStorage.getItem('cs_teachers_cache') || '[]'); } catch (e) { return []; }
        }
        function setCachedTeachers(data) {
            try {
                localStorage.setItem('cs_teachers_cache', JSON.stringify(data));
                localStorage.setItem('cs_teachers_cache_time', Date.now().toString());
            } catch (e) {}
        }

        // ---------- 云端同步 ----------
        async function loadTeachersFromCloud() {
            const cached = getCachedTeachers();
            if (cached.length > 0) {
                teachers = cached;
                renderCards();
                document.getElementById('loadingSub').textContent = '已显示缓存，正在同步...';
            }
            if (!sbClient) { showLoadingError('数据库客户端未初始化'); hideLoading(); return; }
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 8000);
            try {
                const { data, error } = await sbClient.from('teachers').select('*').order('create_time', { ascending: false }).abortSignal(controller.signal);
                clearTimeout(timeoutId);
                if (error) { throw error; }
                teachers = data.map(item => ({
                    _id: item.id,
                    name: item.name,
                    gender: item.gender,
                    subjects: item.subjects || [],
                    grades: item.grades || [],
                    area: item.area,
                    education: item.education,
                    contact_phone: item.contact_phone,
                    contact_wechat: item.contact_wechat,
                    intro: item.intro,
                    price_range: item.price_range,
                    password: item.password,
                    create_time: item.create_time
                }));
                setCachedTeachers(teachers);
                isOnline = true;
                updateConnectionStatus();
                renderCards();
                hideLoading();
            } catch (e) {
                clearTimeout(timeoutId);
                if (e.name === 'AbortError') showToast('连接超时，显示缓存', 'warning');
                handleLoadError(e);
            }
        }

        function handleLoadError(e) {
            const cached = getCachedTeachers();
            if (cached.length > 0) {
                teachers = cached;
                renderCards();
                isOnline = false;
                updateConnectionStatus();
                showToast('当前离线模式，使用缓存数据', 'warning');
            } else {
                showLoadingError('无法连接到云端');
            }
            hideLoading();
        }

        function showLoadingError(msg) {
            document.querySelector('.loading-text').textContent = '❌ ' + msg;
            document.getElementById('loadingSub').innerHTML = '请检查网络后刷新<br><button class="retry-btn" onclick="location.reload()">🔄 刷新重试</button>';
        }

        function hideLoading() {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) { overlay.style.opacity = '0'; setTimeout(() => overlay.style.display = 'none', 300); }
        }

        function updateConnectionStatus() {
            document.getElementById('connectionStatus').innerHTML = isOnline ? '' : '<span class="offline-badge">📴 离线模式</span>';
        }

        async function addTeacherToCloud(teacher) {
            if (!sbClient) { showToast('数据库未连接', 'error'); return null; }
            try {
                const { data, error } = await sbClient.from('teachers').insert([teacher]).select();
                if (error) { showToast('发布失败: ' + error.message, 'error'); return null; }
                isOnline = true;
                updateConnectionStatus();
                return data[0].id;
            } catch (e) { showToast('网络异常', 'error'); return null; }
        }

        async function updateTeacherInCloud(id, updateData) {
            if (!sbClient) { showToast('数据库未连接', 'error'); return false; }
            try {
                const { error } = await sbClient.from('teachers').update(updateData).eq('id', id);
                if (error) { showToast('修改失败: ' + error.message, 'error'); return false; }
                return true;
            } catch (e) { showToast('网络异常', 'error'); return false; }
        }

        async function deleteTeacherFromCloud(id) {
            if (!sbClient) return false;
            try {
                const { error } = await sbClient.from('teachers').delete().eq('id', id);
                return !error;
            } catch (e) { return false; }
        }

        // ---------- 卡片渲染 ----------
        function renderCards() {
            const container = document.getElementById('cardsContainer');
            const filtered = getFilteredTeachers();
            document.getElementById('resultCount').textContent = filtered.length;
            document.getElementById('collect-count-badge').textContent = collectedIds.length;
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><h3>暂无老师信息</h3><p>点击上方按钮发布第一条信息吧！</p></div>';
                return;
            }
            container.innerHTML = filtered.map(t => {
                const isCollected = collectedIds.includes(t._id);
                const adminBtn = isAdmin ? `<button class="btn-admin-delete" onclick="event.stopPropagation();adminDelete('${t._id}')">🗑</button>` : '';
                return `<div class="teacher-card" onclick="openDetail('${t._id}')">${adminBtn}
                    <div class="card-top"><div class="avatar">${t.name.charAt(0)}</div>
                    <div class="card-info"><div class="card-name">${escapeHtml(t.name)} ${t.gender||''}</div>
                    <div class="card-tags">${t.subjects.map(s=>`<span class="tag tag-subject">${s}</span>`).join('')}${t.grades.slice(0,3).map(g=>`<span class="tag tag-grade">${g}</span>`).join('')}<span class="tag tag-area">📍${t.area}</span></div></div></div>
                    <div class="card-desc">${escapeHtml(t.intro||'暂无简介')}</div>
                    <div class="card-footer"><span style="color:var(--accent);font-weight:600;">${t.price_range||'面议'}</span><span>${getTimeAgo(t.create_time)}</span><button class="card-collect ${isCollected?'collected':''}" onclick="event.stopPropagation();toggleCollect('${t._id}')">${isCollected?'⭐':'☆'}</button></div></div>`;
            }).join('');
        }

        function getFilteredTeachers() {
            const keyword = (document.getElementById('searchKeyword')?.value || '').toLowerCase();
            const filterSubject = document.getElementById('filterSubject')?.value;
            const filterGrade = document.getElementById('filterGrade')?.value;
            let filtered = teachers;
            if (keyword) filtered = filtered.filter(t => t.name.toLowerCase().includes(keyword) || t.subjects.some(s=>s.toLowerCase().includes(keyword)) || t.area.includes(keyword));
            if (filterSubject) filtered = filtered.filter(t => t.subjects.includes(filterSubject));
            if (filterGrade) filtered = filtered.filter(t => t.grades.some(g => g.includes(filterGrade)));
            return filtered;
        }

        function openDetail(id) {
            const t = teachers.find(t => t._id == id);
            if (!t) return;
            document.getElementById('modalTitle').textContent = t.name;
            document.getElementById('modalBody').innerHTML = `
                <div id="detailView">
                    <p><strong>科目：</strong>${t.subjects.join('、')}</p>
                    <p><strong>年级：</strong>${t.grades.join('、')}</p>
                    <p><strong>区域：</strong>${t.area}</p>
                    <p><strong>简介：</strong>${t.intro||'无'}</p>
                    <p><strong>价格：</strong>${t.price_range||'面议'}</p>
                    <div style="background:#f9fafb;padding:12px;border-radius:8px;margin-top:12px;">
                        <p>📱 电话：<strong>${t.contact_phone}</strong></p>
                        ${t.contact_wechat?`<p>💬 微信：${t.contact_wechat}</p>`:''}
                    </div>
                    <div style="margin-top:16px;">
                        <button class="btn btn-primary btn-sm" onclick="window.open('tel:${t.contact_phone}')">📞 拨打电话</button>
                        <button class="btn btn-outline btn-sm" style="color:#333;border-color:#ccc;" onclick="toggleCollect('${t._id}');closeModal();">⭐ 收藏</button>
                        <button class="btn btn-outline btn-sm" onclick="startEdit('${t._id}')">✏️ 修改信息</button>
                        <button class="btn-danger-text" onclick="deleteWithPassword('${t._id}')">🗑 删除（需密码）</button>
                        ${isAdmin?`<button style="background:#e74c3c;color:#fff;border:none;padding:6px 12px;border-radius:20px;cursor:pointer;" onclick="adminDelete('${t._id}');closeModal();">👑 管理员删除</button>`:''}
                    </div>
                </div>
                <div id="editView" style="display:none;"></div>
            `;
            document.getElementById('detailModal').style.display = 'flex';
        }

        function closeModal(e) {
            if (e && e.target !== document.getElementById('detailModal')) return;
            document.getElementById('detailModal').style.display = 'none';
        }

        // ---------- 编辑 ----------
        function startEdit(id) {
            const t = teachers.find(t => t._id == id);
            if (!t) return;
            const pwd = prompt('请输入该信息的个人密码以进行修改：');
            if (!pwd) return;
            if (pwd !== t.password && (!isAdmin || pwd !== ADMIN_PASSWORD)) {
                if (pwd) showToast('密码错误', 'error');
                return;
            }
            document.getElementById('detailView').style.display = 'none';
            const editDiv = document.getElementById('editView');
            editDiv.style.display = 'block';
            editDiv.innerHTML = `<h3>✏️ 修改信息</h3>
                <div class="form-row"><div class="form-group"><label>姓名</label><input id="edit_name" value="${escapeHtml(t.name)}"></div><div class="form-group"><label>性别</label><select id="edit_gender"><option value="">不限</option><option value="男" ${t.gender==='男'?'selected':''}>男</option><option value="女" ${t.gender==='女'?'selected':''}>女</option></select></div></div>
                <div class="form-row"><div class="form-group"><label>科目</label><select id="edit_subjects" multiple>${['语文','数学','英语','物理','化学','生物','政治','历史','地理','音乐','美术','体育','编程','其他'].map(s=>`<option value="${s}" ${t.subjects.includes(s)?'selected':''}>${s}</option>`).join('')}</select></div><div class="form-group"><label>年级</label><select id="edit_grades" multiple>${['小学1-3年级','小学4-6年级','初中1年级','初中2年级','初中3年级','高中1年级','高中2年级','高中3年级'].map(g=>`<option value="${g}" ${t.grades.includes(g)?'selected':''}>${g}</option>`).join('')}</select></div></div>
                <div class="form-row"><div class="form-group"><label>区域</label><select id="edit_area">${['天马街道','紫港街道','金川街道','辉埠镇','芳村镇','球川镇','白石镇','青石镇','招贤镇','何家乡','同弓乡','新昌乡','大桥头乡','东案乡','其他区域'].map(a=>`<option value="${a}" ${t.area===a?'selected':''}>${a}</option>`).join('')}</select></div><div class="form-group"><label>学历</label><input id="edit_education" value="${escapeHtml(t.education||'')}"></div></div>
                <div class="form-row"><div class="form-group"><label>电话</label><input id="edit_phone" value="${t.contact_phone}"></div><div class="form-group"><label>微信</label><input id="edit_wechat" value="${t.contact_wechat||''}"></div></div>
                <div class="form-row"><div class="form-group"><label>简介</label><textarea id="edit_intro">${t.intro||''}</textarea></div><div class="form-group"><label>价格</label><input id="edit_price" value="${t.price_range||''}"></div></div>
                <button class="btn btn-primary" onclick="saveEdit('${t._id}')">💾 保存修改</button>
                <button class="btn-reset" onclick="document.getElementById('editView').style.display='none'; document.getElementById('detailView').style.display='block';">取消</button>`;
        }

        async function saveEdit(id) {
            const newData = {
                name: document.getElementById('edit_name').value,
                gender: document.getElementById('edit_gender').value,
                subjects: Array.from(document.getElementById('edit_subjects').selectedOptions).map(o=>o.value),
                grades: Array.from(document.getElementById('edit_grades').selectedOptions).map(o=>o.value),
                area: document.getElementById('edit_area').value,
                education: document.getElementById('edit_education').value,
                contact_phone: document.getElementById('edit_phone').value,
                contact_wechat: document.getElementById('edit_wechat').value,
                intro: document.getElementById('edit_intro').value,
                price_range: document.getElementById('edit_price').value
            };
            const ok = await updateTeacherInCloud(id, newData);
            if (ok) {
                showToast('✅ 修改成功', 'success');
                closeModal();
                loadTeachersFromCloud();
            }
        }

        // ---------- 发布、删除 ----------
        async function handlePublish(e) {
            e.preventDefault();
            const teacher = {
                name: document.getElementById('pub_name').value.trim(),
                gender: document.getElementById('pub_gender').value,
                subjects: Array.from(document.getElementById('pub_subjects').selectedOptions).map(o=>o.value),
                grades: Array.from(document.getElementById('pub_grades').selectedOptions).map(o=>o.value),
                area: document.getElementById('pub_area').value,
                education: document.getElementById('pub_education').value.trim(),
                contact_phone: document.getElementById('pub_phone').value.trim(),
                contact_wechat: document.getElementById('pub_wechat').value.trim(),
                intro: document.getElementById('pub_intro').value.trim(),
                price_range: document.getElementById('pub_price').value.trim(),
                password: document.getElementById('pub_password').value,
                create_time: Date.now()
            };
            if (!teacher.name || !teacher.subjects.length || !teacher.grades.length || !teacher.area || !teacher.contact_phone || !teacher.password) {
                return showToast('请填写所有必填项', 'error');
            }
            const id = await addTeacherToCloud(teacher);
            if (id) {
                document.getElementById('publishForm').reset();
                document.getElementById('publishPanel').classList.remove('visible');
                await loadTeachersFromCloud();
                showToast('✅ 发布成功', 'success');
            }
        }

        async function deleteWithPassword(id) {
            const t = teachers.find(t => t._id == id);
            if (!t) return;
            const pwd = prompt('请输入管理密码：');
            if (pwd === t.password || (isAdmin && pwd === ADMIN_PASSWORD)) {
                if (confirm('确定删除？')) {
                    const ok = await deleteTeacherFromCloud(id);
                    if (ok) {
                        collectedIds = collectedIds.filter(cid => cid != id);
                        localStorage.setItem('cs_collected_ids', JSON.stringify(collectedIds));
                        await loadTeachersFromCloud();
                        showToast('已删除', 'success');
                    }
                }
            } else if (pwd) {
                showToast('密码错误', 'error');
            }
        }

        async function adminDelete(id) {
            if (!isAdmin) return;
            if (confirm('管理员确认删除？')) {
                const ok = await deleteTeacherFromCloud(id);
                if (ok) {
                    collectedIds = collectedIds.filter(cid => cid != id);
                    localStorage.setItem('cs_collected_ids', JSON.stringify(collectedIds));
                    await loadTeachersFromCloud();
                    showToast('管理员已删除', 'success');
                }
            }
        }

        // ---------- 管理员 ----------
        function adminLogin() {
            if (document.getElementById('adminPasswordInput').value === ADMIN_PASSWORD) {
                isAdmin = true;
                localStorage.setItem('cs_admin_logged_in', 'true');
                document.getElementById('adminLoginModal').style.display = 'none';
                document.getElementById('adminIndicator').style.display = 'block';
                showToast('👑 管理员登录成功', 'success');
                renderCards();
            } else {
                showToast('密码错误', 'error');
            }
        }
        function adminLogout() {
            isAdmin = false;
            localStorage.removeItem('cs_admin_logged_in');
            document.getElementById('adminIndicator').style.display = 'none';
            showToast('已退出管理员模式', 'info');
            renderCards();
        }

        let footerClicks = 0;
        document.getElementById('footerTrigger').addEventListener('click', () => {
            footerClicks++;
            if (footerClicks >= 5) { footerClicks=0; if (!isAdmin) document.getElementById('adminLoginModal').style.display='flex'; }
            setTimeout(()=>{footerClicks=0;}, 1500);
        });

        function closeAdminLoginModal(e) {
            if (e && e.target !== document.getElementById('adminLoginModal')) return;
            document.getElementById('adminLoginModal').style.display = 'none';
        }

        // ---------- 收藏 ----------
        function toggleCollect(id) {
            const idx = collectedIds.indexOf(id);
            if (idx >= 0) collectedIds.splice(idx,1);
            else collectedIds.push(id);
            localStorage.setItem('cs_collected_ids', JSON.stringify(collectedIds));
            renderCards();
        }
        function toggleCollectList() {
            const body = document.getElementById('collectModalBody');
            const collected = teachers.filter(t=>collectedIds.includes(t._id));
            body.innerHTML = collected.length === 0 ? '<p style="text-align:center;color:#999;">暂无收藏</p>' : collected.map(t=>`<p>⭐ ${t.name} - ${t.subjects[0]} <button onclick="toggleCollect('${t._id}');toggleCollectList();">取消</button></p>`).join('');
            document.getElementById('collectModal').style.display='flex';
        }
        function closeCollectModal(e) {
            if (e && e.target !== document.getElementById('collectModal')) return;
            document.getElementById('collectModal').style.display = 'none';
        }

        function togglePublishForm() { document.getElementById('publishPanel').classList.toggle('visible'); }
        function resetAllFilters() {
            document.getElementById('searchKeyword').value = '';
            document.getElementById('filterSubject').value = '';
            document.getElementById('filterGrade').value = '';
            renderCards();
        }
        function applyFilters() { renderCards(); }

        // ---------- 工具 ----------
        function showToast(msg, type) {
            const t = document.createElement('div');
            t.className = 'toast ' + (type||'info');
            t.textContent = msg;
            document.getElementById('toastContainer').appendChild(t);
            setTimeout(()=>t.remove(), 3000);
        }
        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s||'';
            return d.innerHTML;
        }
        function getTimeAgo(ts) {
            const diff = Date.now() - ts;
            const min = Math.floor(diff/60000);
            if (min<1) return '刚刚';
            if (min<60) return min+'分钟前';
            const h = Math.floor(diff/3600000);
            if (h<24) return h+'小时前';
            return Math.floor(diff/86400000)+'天前';
        }

        // 10秒强制隐藏加载层
        setTimeout(() => {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay && overlay.style.display !== 'none') {
                hideLoading();
                if (teachers.length === 0) {
                    const cached = getCachedTeachers();
                    if (cached.length > 0) {
                        teachers = cached;
                        renderCards();
                        showToast('⚠️ 加载超时，显示缓存数据', 'warning');
                    } else {
                        document.getElementById('cardsContainer').innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><h3>加载超时</h3><p>请检查网络后刷新</p><button class="retry-btn" onclick="location.reload()">🔄 刷新重试</button></div>';
                    }
                }
            }
        }, 10000);

        // 启动
        loadTeachersFromCloud();
        if (isAdmin) document.getElementById('adminIndicator').style.display = 'block';
    </script>
</body>
</html>
